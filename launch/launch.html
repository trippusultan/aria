<!doctype html>
<html><head><meta charset="utf-8"><title>Aria launch</title>
<style>
@font-face { font-family: "Geist Mono"; src: url("../public/fonts/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist"; src: url("../public/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
:root { --ink: #0e0e0d; --cream: #e9e3d6; --muted: #8c877c; --line: #2a2a27; --rust: #e0795c; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; background: var(--ink); color: var(--cream); overflow: hidden; font-family: "Geist Mono", monospace; }
.scene { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; opacity: 0; }
.big { font-size: 96px; font-weight: 600; letter-spacing: -.05em; line-height: 1.02; }
.huge { font-size: 380px; font-weight: 700; letter-spacing: -.08em; line-height: .9; }
.small { font-size: 44px; color: var(--muted); letter-spacing: -.02em; }
.strike { position: absolute; left: -4%; right: -4%; top: 52%; height: 14px; background: var(--rust); transform-origin: left; transform: scaleX(0); }
.bubble { position: absolute; left: 90px; right: 90px; top: 520px; padding: 44px 48px; border: 2px solid var(--line); border-radius: 36px 36px 36px 8px;
  font-family: "Geist", sans-serif; font-size: 50px; line-height: 1.25; color: var(--cream); background: #151514; text-align: left; opacity: 0; }
.bubble .who { display: block; font: 600 28px "Geist Mono"; color: var(--muted); margin-bottom: 16px; }
.card { position: absolute; left: 90px; right: 90px; padding: 36px 40px; border-radius: 28px; background: var(--cream); color: var(--ink); text-align: left; opacity: 0; }
.card .t { font: 600 46px "Geist", sans-serif; letter-spacing: -.02em; line-height: 1.15; }
.card .row { display: flex; align-items: center; gap: 16px; margin-top: 22px; font-size: 30px; }
.chip { padding: 6px 18px; border: 2px solid var(--ink); border-radius: 999px; }
.due { margin-left: auto; font-weight: 700; font-size: 38px; }
.label { position: absolute; left: 0; right: 0; top: 300px; font-size: 54px; font-weight: 600; letter-spacing: -.03em; opacity: 0; }
.cat { position: relative; width: 260px; height: 190px; border-radius: 60px 60px 90px 90px; background: var(--cream); margin: 0 auto 70px; }
.cat::before, .cat::after { content: ""; position: absolute; top: -70px; border: 56px solid transparent; border-bottom: 80px solid var(--cream); border-top: 0; }
.cat::before { left: 6px; } .cat::after { right: 6px; }
.eye { position: absolute; top: 78px; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); }
.eye.l { left: 70px; } .eye.r { right: 70px; }
.word { font-size: 150px; font-weight: 700; letter-spacing: -.07em; }
.handle { margin-top: 40px; font-size: 34px; color: var(--muted); }
</style></head>
<body>
<section class="scene" id="s1"><div class="big">you made</div><div class="huge" id="count">0</div><div class="big">promises today.</div></section>
<section class="scene" id="s2"><div class="big" style="position:relative">you'll remember<div class="strike" id="strike"></div></div><div class="huge" style="color:var(--rust)">3</div></section>
<section class="scene" id="s3" style="display:block">
  <div class="label" id="lab">Aria catches every one.</div>
  <div class="bubble" id="bub"><span class="who">Ananya · Northwind call · 10:42</span>"I'll send the term sheet by Thursday."</div>
  <div class="card" id="c1" style="top:520px"><div class="t">Send the term sheet</div><div class="row"><span class="chip">Ananya Shah</span><span class="due">T-2d</span></div></div>
  <div class="card" id="c2" style="top:860px"><div class="t">Confirm cap with compliance</div><div class="row"><span class="chip">Rohan Mehta</span><span class="due">T-3d</span></div></div>
  <div class="card" id="c3" style="top:1200px"><div class="t">Attach the SAR policy</div><div class="row"><span class="chip">Kavita Rao</span><span class="due">T-4d</span></div></div>
</section>
<section class="scene" id="s4"><div class="cat" id="cat"><span class="eye l" id="el"></span><span class="eye r" id="er"></span></div>
  <div class="word">Aria</div><div class="small">Every commitment, kept.</div><div class="handle">@trippusultan</div></section>
<script>
// Everything is a paused animation on one timeline; render.mjs seeks it per frame via __frame(t).
const SPRING = 'cubic-bezier(.16, 1, .3, 1)';
const $ = (s) => document.querySelector(s);
const at = (el, kf, start, dur, easing = SPRING, fill = 'both') => el.animate(kf, { delay: start * 1000, duration: dur * 1000, fill, easing });
const inOut = (el, a, b, fade = .25) => { at(el, [{ opacity: 0 }, { opacity: 1 }], a, fade); at(el, [{ opacity: 1 }, { opacity: 0 }], b - fade, fade, 'linear', 'forwards'); };
// Hook 0-2.7s: counter to 14
inOut($('#s1'), 0, 2.7); at($('#count'), [{ transform: 'scale(.6)' }, { transform: 'scale(1)' }], 0, 1.8);
// 2.7-4.1s: you'll remember 3 (struck)
inOut($('#s2'), 2.7, 4.1, .15); at($('#s2'), [{ transform: 'scale(1.15)' }, { transform: 'scale(1)' }], 2.7, .5);
at($('#strike'), [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], 3.35, .35);
// 4.1-9.0s: quote morphs into a task, two more stack
$('#s3').animate([{ opacity: 0 }, { opacity: 1, offset: .06 }, { opacity: 1, offset: .95 }, { opacity: 0 }], { delay: 4100, duration: 4900, fill: 'both', easing: 'linear' });
at($('#bub'), [{ opacity: 0, transform: 'translateY(60px) scale(.96)' }, { opacity: 1, transform: 'none' }], 4.2, .5);
at($('#bub'), [{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'scale(.9)', filter: 'blur(12px)' }], 5.7, .45);
at($('#c1'), [{ opacity: 0, transform: 'scale(.9) rotate(-2deg)' }, { opacity: 1, transform: 'none' }], 5.8, .6);
at($('#c2'), [{ opacity: 0, transform: 'translateY(80px)' }, { opacity: 1, transform: 'none' }], 6.6, .5);
at($('#c3'), [{ opacity: 0, transform: 'translateY(80px)' }, { opacity: 1, transform: 'none' }], 7.1, .5);
at($('#lab'), [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], 6.9, .5);
// 9.0-12s: cat blinks, wordmark
at($('#s4'), [{ opacity: 0 }, { opacity: 1 }], 9.0, .35, 'linear');
at($('#cat'), [{ transform: 'translateY(40px) scale(.8)' }, { transform: 'none' }], 9.0, .7);
for (const e of ['#el', '#er']) at($(e), [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.1)' }, { transform: 'scaleY(1)' }], 10.2, .28, 'ease-in-out');
window.__frame = (t) => {
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; }
  $('#count').textContent = Math.round(14 * Math.min(1, Math.max(0, (t - .3) / 1.4)) ** .6);
};
window.__ready = () => document.fonts.ready;
</script></body></html>
